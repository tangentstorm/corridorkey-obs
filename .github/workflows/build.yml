name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  # The OBS release this plugin is built and ABI-checked against. build.rs reads
  # the export table out of this obs.dll to generate an import library, because
  # OBS ships no obs.lib and requiring a full obs-studio build just to compile a
  # filter is a heavy ask.
  OBS_VERSION: 32.2.2

jobs:
  build:
    name: build plugin
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Only obs.dll is needed (~1MB), but it ships only inside a 188MB zip, so
      # the extracted DLL is cached and the download happens once per OBS version.
      - name: Cache obs.dll
        id: obs-cache
        uses: actions/cache@v4
        with:
          path: obs-sdk
          key: obs-dll-${{ env.OBS_VERSION }}

      - name: Fetch obs.dll
        if: steps.obs-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/obsproject/obs-studio/releases/download/$env:OBS_VERSION/OBS-Studio-$env:OBS_VERSION-Windows-x64.zip"
          Write-Host "downloading $url"
          Invoke-WebRequest -Uri $url -OutFile obs.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path obs.zip))
          try {
            $entry = $zip.Entries | Where-Object { $_.FullName -eq 'bin/64bit/obs.dll' }
            if (-not $entry) { throw "obs.dll not found in the OBS zip" }
            New-Item -ItemType Directory -Force -Path obs-sdk/bin/64bit | Out-Null
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile(
              $entry, (Join-Path (Resolve-Path obs-sdk/bin/64bit) 'obs.dll'), $true)
          } finally {
            $zip.Dispose()
          }
          Remove-Item obs.zip

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # build.rs finds lib.exe through the registry; setting up the MSVC
      # environment explicitly avoids depending on the runner image's layout.
      - uses: ilammy/msvc-dev-cmd@v1

      # src/obs.rs is hand-written FFI. A wrong enum value there is not a compile
      # error and usually not a crash either, just a control that silently never
      # appears; this catches that class of bug against the real headers.
      - name: Check FFI constants against the OBS headers
        shell: pwsh
        run: python tools/check_obs_constants.py --obs-version $env:OBS_VERSION

      - name: Test
        shell: pwsh
        env:
          OBS_INSTALL_DIR: ${{ github.workspace }}/obs-sdk
        run: |
          # The test binary links against obs.dll, so it must be loadable at runtime.
          $env:PATH = "$env:GITHUB_WORKSPACE\obs-sdk\bin\64bit;$env:PATH"
          cargo test --release --locked

      - name: Build
        shell: pwsh
        env:
          OBS_INSTALL_DIR: ${{ github.workspace }}/obs-sdk
        run: cargo build --release --locked

      - name: Stage package
        shell: pwsh
        run: |
          $stage = "dist/corridorkey-obs"
          New-Item -ItemType Directory -Force -Path "$stage/plugin/bin/64bit" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/plugin/data/effects" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/plugin/data/models" | Out-Null

          Copy-Item target/release/corridorkey_obs.dll "$stage/plugin/bin/64bit/corridorkey-obs.dll"
          Copy-Item data/effects/corridorkey.effect "$stage/plugin/data/effects/"
          Copy-Item install.ps1, README.md "$stage/"
          Copy-Item tools/package/get-models.ps1 "$stage/"
          Copy-Item tools/package/NOTICE.txt "$stage/"
          Copy-Item tools/export/export_onnx.py "$stage/"

          # Models are not redistributed: they derive from upstream checkpoints
          # under a non-commercial licence. Say so where someone will look for them.
          @"
          No models are shipped with this plugin.

          Run get-models.ps1 (one directory up) to download the CorridorKey
          checkpoints and convert them, then re-run install.ps1. The files land
          here as corridorkey_<green|blue>_<size>_fp16.onnx.

          Without at least one model the filter loads but passes video through
          untouched, and says so in its properties panel.
          "@ | Set-Content "$stage/plugin/data/models/NO-MODELS-YET.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: corridorkey-obs-windows-x64
          path: dist/corridorkey-obs
          if-no-files-found: error

      # Inno Setup is not reliably present on the runner image, so install it.
      - name: Build installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $crate = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $version = "$crate+$($env:GITHUB_SHA.Substring(0, 7))"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp `
            "/DStage=$env:GITHUB_WORKSPACE\dist\corridorkey-obs" "/DAppVersion=$version" `
            "/O$env:GITHUB_WORKSPACE\dist\installer" tools\package\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed (exit $LASTEXITCODE)" }

      - uses: actions/upload-artifact@v4
        with:
          name: corridorkey-obs-setup
          path: dist/installer
          if-no-files-found: error

  # A single rolling release, replaced on every push to main, so the download
  # link in the README never changes. It carries only the installer: no models.
  release:
    name: publish latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: corridorkey-obs-setup
          path: setup

      - name: Replace the latest release
        run: |
          cat > notes.md <<'NOTES'
          Windows installer for the CorridorKey OBS filter, built from the commit in
          the title. Rebuilt on every push to main.

          **No support is provided.** See the README.

          Run `corridorkey-obs-setup.exe` with OBS closed. Requires OBS Studio
          ${{ env.OBS_VERSION }}.x on Windows and a DX12 GPU.

          **No models are included.** They derive from Niko Pueringer's
          [CorridorKey](https://github.com/nikopueringer/CorridorKey) checkpoints,
          which carry a non-commercial licence, so you have to generate them
          yourself from the source in this repository. Without them the filter
          loads but passes video through untouched.
          NOTES
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest setup/corridorkey-obs-setup.exe --target "$GITHUB_SHA" --latest --title "Latest build (${GITHUB_SHA::7})" --notes-file notes.md
