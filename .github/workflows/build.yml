name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  # The OBS release this plugin is built and ABI-checked against. build.rs reads
  # the export table out of this obs.dll to generate an import library, because
  # OBS ships no obs.lib and requiring a full obs-studio build just to compile a
  # filter is a heavy ask.
  OBS_VERSION: 32.2.2

jobs:
  build:
    name: build plugin
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Only obs.dll is needed (~1MB), but it ships only inside a 188MB zip, so
      # the extracted DLL is cached and the download happens once per OBS version.
      - name: Cache obs.dll
        id: obs-cache
        uses: actions/cache@v4
        with:
          path: obs-sdk
          key: obs-dll-${{ env.OBS_VERSION }}

      - name: Fetch obs.dll
        if: steps.obs-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://github.com/obsproject/obs-studio/releases/download/$env:OBS_VERSION/OBS-Studio-$env:OBS_VERSION-Windows-x64.zip"
          Write-Host "downloading $url"
          Invoke-WebRequest -Uri $url -OutFile obs.zip
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path obs.zip))
          try {
            $entry = $zip.Entries | Where-Object { $_.FullName -eq 'bin/64bit/obs.dll' }
            if (-not $entry) { throw "obs.dll not found in the OBS zip" }
            New-Item -ItemType Directory -Force -Path obs-sdk/bin/64bit | Out-Null
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile(
              $entry, (Join-Path (Resolve-Path obs-sdk/bin/64bit) 'obs.dll'), $true)
          } finally {
            $zip.Dispose()
          }
          Remove-Item obs.zip

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # build.rs finds lib.exe through the registry; setting up the MSVC
      # environment explicitly avoids depending on the runner image's layout.
      - uses: ilammy/msvc-dev-cmd@v1

      - name: Test
        shell: pwsh
        env:
          OBS_INSTALL_DIR: ${{ github.workspace }}/obs-sdk
        run: |
          # The test binary links against obs.dll, so it must be loadable at runtime.
          $env:PATH = "$env:GITHUB_WORKSPACE\obs-sdk\bin\64bit;$env:PATH"
          cargo test --release --locked

      - name: Build
        shell: pwsh
        env:
          OBS_INSTALL_DIR: ${{ github.workspace }}/obs-sdk
        run: cargo build --release --locked

      - name: Stage package
        shell: pwsh
        run: |
          $stage = "dist/corridorkey-obs"
          New-Item -ItemType Directory -Force -Path "$stage/plugin/bin/64bit" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/plugin/data/effects" | Out-Null
          New-Item -ItemType Directory -Force -Path "$stage/plugin/data/models" | Out-Null

          Copy-Item target/release/corridorkey_obs.dll "$stage/plugin/bin/64bit/corridorkey-obs.dll"
          Copy-Item data/effects/corridorkey.effect "$stage/plugin/data/effects/"
          Copy-Item install.ps1, README.md "$stage/"
          Copy-Item tools/package/get-models.ps1 "$stage/"
          Copy-Item tools/package/NOTICE.txt "$stage/"
          Copy-Item tools/export/export_onnx.py "$stage/"

          # Models are not redistributed: they derive from upstream checkpoints
          # under a non-commercial licence. Say so where someone will look for them.
          @"
          No models are shipped with this plugin.

          Run get-models.ps1 (one directory up) to download the CorridorKey
          checkpoints and convert them, then re-run install.ps1. The files land
          here as corridorkey_<green|blue>_<size>_fp16.onnx.

          Without at least one model the filter loads but passes video through
          untouched, and says so in its properties panel.
          "@ | Set-Content "$stage/plugin/data/models/NO-MODELS-YET.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: corridorkey-obs-windows-x64
          path: dist/corridorkey-obs
          if-no-files-found: error

  release:
    name: publish release
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: corridorkey-obs-windows-x64
          path: pkg

      - name: Zip
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p out
          (cd pkg && zip -r "../out/corridorkey-obs-${version}-windows-x64.zip" .)
          ls -lh out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            ## Install

            1. Download and unzip `corridorkey-obs-<version>-windows-x64.zip`.
            2. Run `get-models.ps1` to fetch and convert the model (needs Python
               via [uv](https://docs.astral.sh/uv/) and git; takes a few minutes
               and downloads ~2GB of build-time dependencies).
            3. Run `install.ps1`.
            4. Restart OBS and add **CorridorKey (Neural Green Screen)** as a
               filter on your camera source.

            No compiler or Rust toolchain needed for the plugin itself.
            Requires OBS Studio ${{ env.OBS_VERSION }}.x on Windows and a DX12 GPU.

            The models are **not** distributed here: they derive from the
            [CorridorKey](https://github.com/nikopueringer/CorridorKey)
            checkpoints by Niko Pueringer, which carry a CC BY-NC-SA 4.0 variant.
            `get-models.ps1` fetches them from the author's HuggingFace directly.
            See `NOTICE.txt`.
